<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cafs — Curated Anime Resource Directory</title>
  <meta name="description" content="cafs is a curated index of the best anime resources on the internet.">
  <style>
    body { font-family: ui-monospace, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; background: #000000; color: #f8f4e1; min-height: 100vh; display: grid; place-items: center; }
  </style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <script>
    (function() {
      // Must match `base` in vite.config.ts so refresh/deep links resolve correctly.
      var base = '/CAFS';
      var path = window.location.pathname;
      if (path.startsWith(base)) {
        path = path.slice(base.length) || '/';
      }
      sessionStorage.setItem('redirect', path + window.location.search);
      window.location.replace(base + '/');
    })();
  </script>
</head>
<body>
    <p>Redirecting to cafs…</p>
</body>
</html>
