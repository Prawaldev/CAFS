<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>welcome . cafs</title>
  <meta name="description" content="cafs is a curated index of the best anime resources on the internet. Hand-picked streaming sites, download sources, tools, and more.">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="color-scheme" content="dark light">
<link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon/favicon.svg">
<link rel="icon" type="image/x-icon" href="%BASE_URL%favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="96x96" href="%BASE_URL%favicon/favicon-96x96.png">
<link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%favicon/apple-touch-icon.png">
<link rel="manifest" href="%BASE_URL%favicon/site.webmanifest">
  <meta property="og:title" content="cafs — Curated Anime Resource Directory">
  <meta property="og:description" content="cafs is a curated index of the best anime resources on the internet.">
  <meta property="og:type" content="website">
  <meta name="robots" content="index, follow">
  <script>
    // apply the saved theme before first paint so the page never flashes
    (function () {
      try {
        var saved = localStorage.getItem('piralib-theme')
        var theme = saved ? JSON.parse(saved) : 'dark'
        if (theme === 'light' || theme === 'dark' || theme === 'amoled') {
          document.documentElement.dataset.theme = theme
          document.documentElement.setAttribute('data-theme', theme)
          if (theme === 'amoled' || theme === 'dark') {
            document.documentElement.classList.add('dark')
          }
          if (theme === 'amoled') {
            document.documentElement.classList.add('amoled')
          }
        }
        var preset = localStorage.getItem('piralib-theme-preset')
        var parsedPreset = preset ? JSON.parse(preset) : null
        if (parsedPreset) {
          document.documentElement.dataset.themePreset = parsedPreset
          document.documentElement.setAttribute('data-theme-preset', parsedPreset)
        }
      } catch (error) {
        /* private mode — keep the dark default */
      }
    })()
  </script>
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <div id="navbar-slot"></div>
  <div id="app-slot"></div>
</body>
</html>
